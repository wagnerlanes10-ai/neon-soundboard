<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Soundboard Pro - Igreja</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
            padding: 10px;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 15px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .nav-btn { background: none; border: none; color: #38bdf8; font-size: 20px; cursor: pointer; padding: 8px; }
        .playlist-info { text-align: center; flex-grow: 1; }
        .playlist-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .playlist-name { font-size: 16px; font-weight: bold; color: #38bdf8; margin-top: 3px; }
        
        .add-playlist-btn {
            background: #38bdf8;
            border: none;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        
        .categories {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding: 5px 0;
        }
        
        .category-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #94a3b8;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .category-btn.active {
            background: #38bdf8;
            border-color: #38bdf8;
            color: white;
        }
        
        .grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            gap: 10px !important;
            margin-bottom: 15px;
            width: 100% !important;
        }
        
        .pad {
            aspect-ratio: 1 / 1 !important;
            border-radius: 14px;
            display: flex !important;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 100% !important;
            overflow: hidden;
        }
        
        .pad:active { transform: scale(0.93); }
        .pad.playing { animation: pulse 1s infinite; border-color: #4ade80; }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(74, 222, 128, 0.3); }
            50% { box-shadow: 0 0 25px rgba(74, 222, 128, 0.6); }
        }
        
        .pad.empty {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(255, 255, 255, 0.1);
        }
        
        .pad.pad { background: linear-gradient(135deg, #4ade80, #16a34a); }
        .pad.ambient { background: linear-gradient(135deg, #60a5fa, #2563eb); }
        .pad.transition { background: linear-gradient(135deg, #c084fc, #9333ea); }
        .pad.message { background: linear-gradient(135deg, #fb923c, #ea580c); }
        .pad.celebration { background: linear-gradient(135deg, #f87171, #dc2626); }
        
        .pad-icon { font-size: 24px; margin-bottom: 4px; }
        
        .pad-label { 
            font-size: 9px; 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            text-align: center; 
            padding: 0 4px; 
            max-width: 90%; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            display: block;
        }
        
        .pad-key {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 10px;
            color: #fbbf24;
        }
        
        .pad-loop { position: absolute; top: 5px; right: 5px; font-size: 10px; background: rgba(0, 0, 0, 0.5); padding: 2px 5px; border-radius: 8px; }
        .edit-indicator { position: absolute; top: 5px; left: 5px; background: rgba(0, 0, 0, 0.5); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .control-btn {
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
        }
        
        .btn-record { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-import { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-dark { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-settings { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        
        .instructions {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            font-size: 10px;
            color: #64748b;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        .modal-content {
            background: #0a0e27;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-title { font-size: 18px; margin-bottom: 15px; color: #38bdf8; text-align: center; }
        
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .form-input, .form-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 13px;
        }
        
        .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 12px; }
        
        .modal-actions { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .modal-btn {
            flex: 1;
            min-width: 45%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-save { background: #4ade80; color: white; }
        .btn-cancel { background: #64748b; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        
        .hidden-input { display: none; }
        
        /* ===== SEÇÃO DE TOM ===== */
        .key-display {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.05));
            border: 2px solid #fbbf24;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .key-original {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .key-detected {
            font-size: 28px;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        
        .key-arrow {
            font-size: 18px;
            color: #64748b;
            margin: 5px 0;
        }
        
        .key-current {
            font-size: 24px;
            font-weight: bold;
            color: #4ade80;
        }
        
        .key-transpose {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }
        
        .key-loading {
            color: #38bdf8;
            font-size: 13px;
            padding: 10px;
        }
        
        /* Botões rápidos de transposição */
        .quick-transpose {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .qt-btn {
            padding: 10px 4px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .qt-btn.active {
            background: #fbbf24;
            border-color: #fbbf24;
            color: #000;
        }
        
        .qt-btn:hover { border-color: #fbbf24; }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .slider-container input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }
        
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fbbf24;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .slider-value {
            min-width: 50px;
            text-align: center;
            font-size: 12px;
            color: #fbbf24;
            font-weight: bold;
        }
        
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }
        
        .slot-btn {
            aspect-ratio: 1;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        .slot-btn.filled {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        
        .slot-btn small {
            font-size: 9px;
            color: #94a3b8;
            font-weight: normal;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #4ade80;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .toast.show { opacity: 1; }
        .toast.error { background: #ef4444; }
        
        .import-info {
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
            margin-top: 10px;
            padding: 8px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <button class="nav-btn" onclick="previousPlaylist()">⬅️</button>
            <div class="playlist-info">
                <div class="playlist-label">Playlist Atual</div>
                <div class="playlist-name" id="playlistName">Adoração</div>
            </div>
            <button class="add-playlist-btn" onclick="addPlaylist()">+</button>
        </div>
        
        <div class="categories">
            <button class="category-btn active" data-category="pad">🎹 Pad</button>
            <button class="category-btn" data-category="ambient">🌊 Ambient</button>
            <button class="category-btn" data-category="transition">🔔 Transição</button>
            <button class="category-btn" data-category="message">📖 Mensagem</button>
            <button class="category-btn" data-category="celebration">🎉 Celebração</button>
        </div>
        
        <div class="grid" id="padGrid"></div>
        
        <div class="controls">
            <button class="control-btn btn-record" onclick="openRecordModal()">🎙️ Gravar</button>
            <button class="control-btn btn-import" onclick="openImportSelector()">📂 Importar</button>
            <button class="control-btn btn-dark" onclick="toggleDarkMode()">🌙 Escuro</button>
            <button class="control-btn btn-settings" onclick="openSettings()">⚙️ Config</button>
        </div>
        
        <input type="file" id="fileInput" class="hidden-input" accept="audio/mpeg,audio/mp3,audio/wav,audio/wave,audio/x-wav,audio/mp4,audio/aac,.mp3,.wav,.m4a,.aac" onchange="handleFileImport(event)">
        <input type="file" id="editFileInput" class="hidden-input" accept="audio/mpeg,audio/mp3,audio/wav,audio/wave,audio/x-wav,audio/mp4,audio/aac,.mp3,.wav,.m4a,.aac" onchange="handleEditFileImport(event)">
        
        <div class="instructions">💡 Toque: Tocar | Toque longo: Editar</div>
    </div>
    
    <div class="toast" id="toast"></div>
    
    <!-- Modal de Seleção de Slot -->
    <div class="modal" id="importSelectorModal">
        <div class="modal-content">
            <h2 class="modal-title">📂 Escolha onde salvar</h2>
            <div class="slot-grid" id="slotGrid"></div>
            <div class="import-info">📁 Formatos: MP3, WAV, M4A, AAC</div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeImportSelector()">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Modal de Gravação -->
    <div class="modal" id="recordModal">
        <div class="modal-content">
            <h2 class="modal-title">🎙️ Gravar Som</h2>
            <button id="recordBtn" onclick="toggleRecording()" style="width: 80px; height: 80px; border-radius: 50%; background: #ef4444; border: none; color: white; font-size: 32px; cursor: pointer; margin: 15px auto; display: flex; align-items: center; justify-content: center;">🎤</button>
            <p id="recordStatus" style="text-align: center; color: #94a3b8; font-size: 13px;">Pronto para gravar</p>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeRecordModal()">Cancelar</button>
                <button class="modal-btn btn-save" onclick="saveRecording()" id="saveBtn" disabled>Salvar</button>
            </div>
        </div>
    </div>
    
    <!-- Modal de Edição -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 class="modal-title">✏️ Editar Botão</h2>
            <p id="editPadName" style="margin-bottom: 15px; color: #94a3b8; font-size: 13px; text-align: center;"></p>
            
            <!-- SEÇÃO DE TOM -->
            <div class="key-display" id="keyDisplay">
                <div class="key-original">Tom detectado</div>
                <div class="key-detected" id="detectedKey">...</div>
                <div class="key-arrow">⬇️ Transposição</div>
                <div class="key-current" id="currentKey">...</div>
                <div class="key-transpose" id="transposeInfo">0 semitons</div>
            </div>
            
            <!-- Botões rápidos de transposição -->
            <div class="form-group">
                <label class="form-label">⚡ Transposição Rápida</label>
                <div class="quick-transpose">
                    <button class="qt-btn" data-val="-3">-3</button>
                    <button class="qt-btn" data-val="-2">-2</button>
                    <button class="qt-btn" data-val="-1">-1</button>
                    <button class="qt-btn active" data-val="0">0</button>
                    <button class="qt-btn" data-val="1">+1</button>
                    <button class="qt-btn" data-val="2">+2</button>
                    <button class="qt-btn" data-val="3">+3</button>
                </div>
            </div>
            
            <!-- Slider fino -->
            <div class="form-group">
                <label class="form-label">🎚️ Ajuste Fino (-12 a +12)</label>
                <div class="slider-container">
                    <input type="range" id="pitchSlider" min="-12" max="12" value="0" step="1">
                    <span class="slider-value" id="sliderValue">0 st</span>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Nome</label>
                <input type="text" class="form-input" id="editName" placeholder="Nome do som">
            </div>
            
            <div class="form-group">
                <label class="form-label">Categoria</label>
                <select class="form-select" id="editCategory">
                    <option value="pad">🎹 Pad</option>
                    <option value="ambient">🌊 Ambient</option>
                    <option value="transition">🔔 Transição</option>
                    <option value="message">📖 Mensagem</option>
                    <option value="celebration">🎉 Celebração</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Opções</label>
                <div class="checkbox-group">
                    <label class="checkbox-item"><input type="checkbox" id="editLoop"> 🔄 Loop</label>
                    <label class="checkbox-item"><input type="checkbox" id="editFadeIn"> 📈 Fade In</label>
                    <label class="checkbox-item"><input type="checkbox" id="editFadeOut"> 📉 Fade Out</label>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">⏱️ Timer (segundos, 0 = infinito)</label>
                <input type="number" class="form-input" id="editTimer" min="0" value="0" placeholder="0">
            </div>
            
            <div class="modal-actions" style="flex-direction: column;">
                <button class="modal-btn" style="background: #ef4444; color: white;" onclick="openRecordFromEdit()">🎙️ Gravar Novo</button>
                <button class="modal-btn" style="background: #3b82f6; color: white;" id="editImportBtn">📂 Trocar Áudio (MP3/WAV)</button>
                <button class="modal-btn" style="background: #8b5cf6; color: white;" onclick="reanalyzeKey()">🔍 Reanalisar Tom</button>
                <button class="modal-btn btn-save" onclick="saveEdit()">💾 Salvar</button>
                <button class="modal-btn btn-delete" onclick="clearPad()">🗑️ Limpar</button>
                <button class="modal-btn btn-cancel" onclick="closeEditModal()">Fechar</button>
            </div>
        </div>
    </div>
    
    <script>
        // ============ CONSTANTES DE TOM ============
        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const NOTE_NAMES_PT = ['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Lá#', 'Si'];
        
        // Templates de tonalidade (Krumhansl-Schmuckler)
        const MAJOR_TEMPLATE = [6.335, 2.233, 3.474, 2.335, 5.104, 3.695, 2.172, 4.877, 2.256, 3.420, 2.466, 3.166];
        const MINOR_TEMPLATE = [6.335, 2.233, 3.488, 2.335, 5.104, 3.695, 2.172, 4.877, 2.256, 3.420, 2.466, 3.166];
        
        // ============ INDEXEDDB ============
        let db;
        const DB_NAME = 'SoundboardDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'audios';
        const KEYS_STORE = 'keys';
        
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                    if (!db.objectStoreNames.contains(KEYS_STORE)) {
                        db.createObjectStore(KEYS_STORE);
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => reject(e);
            });
        }
        
        function saveAudioToDB(key, blob) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(blob, key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }
        
        function getAudioFromDB(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e);
            });
        }
        
        function deleteAudioFromDB(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }
        
        function saveKeyToDB(key, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(KEYS_STORE, 'readwrite');
                tx.objectStore(KEYS_STORE).put(data, key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }
        
        function getKeyFromDB(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(KEYS_STORE, 'readonly');
                const req = tx.objectStore(KEYS_STORE).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e);
            });
        }
        
        // ============ DETECTOR DE TOM ============
        async function detectKey(audioBuffer) {
            try {
                // Extrair canal mono
                const channelData = audioBuffer.getChannelData(0);
                const sampleRate = audioBuffer.sampleRate;
                
                // Pegar uma amostra (máx 30 segundos para performance)
                const maxSamples = Math.min(channelData.length, sampleRate * 30);
                const samples = channelData.slice(0, maxSamples);
                
                // Calcular histograma de pitch classes via FFT
                const pitchClasses = new Array(12).fill(0);
                const fftSize = 8192;
                const hopSize = fftSize / 4;
                
                for (let i = 0; i < samples.length - fftSize; i += hopSize) {
                    const frame = samples.slice(i, i + fftSize);
                    
                    // Aplicar janela de Hann
                    const windowed = new Float32Array(fftSize);
                    for (let j = 0; j < fftSize; j++) {
                        const w = 0.5 * (1 - Math.cos(2 * Math.PI * j / (fftSize - 1)));
                        windowed[j] = frame[j] * w;
                    }
                    
                    // FFT simplificada - encontrar picos de frequência
                    const spectrum = computeFFT(windowed);
                    
                    // Encontrar picos e converter para pitch class
                    const peaks = findPeaks(spectrum, sampleRate, fftSize);
                    peaks.forEach(freq => {
                        if (freq > 50 && freq < 2000) {
                            const midiNote = 69 + 12 * Math.log2(freq / 440);
                            const pitchClass = Math.round(midiNote) % 12;
                            pitchClasses[(pitchClass + 12) % 12] += 1;
                        }
                    });
                }
                
                // Normalizar
                const maxVal = Math.max(...pitchClasses) || 1;
                const normalized = pitchClasses.map(v => v / maxVal);
                
                // Correlação com templates (maior e menor)
                let bestMatch = { key: 0, mode: 'major', score: -Infinity };
                
                for (let rot = 0; rot < 12; rot++) {
                    const rotated = rotateArray(normalized, rot);
                    
                    const majorScore = correlate(rotated, MAJOR_TEMPLATE);
                    const minorScore = correlate(rotated, MINOR_TEMPLATE);
                    
                    if (majorScore > bestMatch.score) {
                        bestMatch = { key: (12 - rot) % 12, mode: 'major', score: majorScore };
                    }
                    if (minorScore > bestMatch.score) {
                        bestMatch = { key: (12 - rot) % 12, mode: 'minor', score: minorScore };
                    }
                }
                
                return {
                    keyIndex: bestMatch.key,
                    keyName: NOTE_NAMES[bestMatch.key],
                    keyNamePT: NOTE_NAMES_PT[bestMatch.key],
                    mode: bestMatch.mode,
                    confidence: Math.round(bestMatch.score * 100),
                    display: `${NOTE_NAMES[bestMatch.key]} ${bestMatch.mode === 'major' ? '' : 'm'}`
                };
            } catch (err) {
                console.error('Erro na detecção:', err);
                return { keyIndex: 0, keyName: '?', keyNamePT: 'Indefinido', mode: 'unknown', confidence: 0, display: '?' };
            }
        }
        
        function computeFFT(input) {
            // FFT simplificada via Goertzel para frequências específicas
            const sampleRate = 44100;
            const frequencies = [];
            const magnitudes = [];
            
            // Analisar frequências de C2 (65Hz) a C7 (2093Hz)
            for (let midi = 36; midi <= 96; midi++) {
                const freq = 440 * Math.pow(2, (midi - 69) / 12);
                const mag = goertzel(input, freq, sampleRate);
                frequencies.push(freq);
                magnitudes.push(mag);
            }
            
            return { frequencies, magnitudes };
        }
        
        function goertzel(samples, targetFreq, sampleRate) {
            const N = samples.length;
            const k = (N * targetFreq) / sampleRate;
            const omega = (2 * Math.PI * k) / N;
            const coeff = 2 * Math.cos(omega);
            
            let s0 = 0, s1 = 0, s2 = 0;
            for (let i = 0; i < N; i++) {
                s0 = samples[i] + coeff * s1 - s2;
                s2 = s1;
                s1 = s0;
            }
            
            return Math.sqrt(s1 * s1 + s2 * s2 - coeff * s1 * s2);
        }
        
        function findPeaks(spectrum, sampleRate, fftSize) {
            const peaks = [];
            const { frequencies, magnitudes } = spectrum;
            
            // Encontrar picos locais
            for (let i = 1; i < magnitudes.length - 1; i++) {
                if (magnitudes[i] > magnitudes[i-1] && 
                    magnitudes[i] > magnitudes[i+1] &&
                    magnitudes[i] > 0.1) {
                    peaks.push(frequencies[i]);
                }
            }
            
            return peaks;
        }
        
        function rotateArray(arr, n) {
            return [...arr.slice(n), ...arr.slice(0, n)];
        }
        
        function correlate(a, b) {
            const meanA = a.reduce((s, v) => s + v, 0) / a.length;
            const meanB = b.reduce((s, v) => s + v, 0) / b.length;
            
            let num = 0, denA = 0, denB = 0;
            for (let i = 0; i < a.length; i++) {
                const da = a[i] - meanA;
                const db = b[i] - meanB;
                num += da * db;
                denA += da * da;
                denB += db * db;
            }
            
            return num / (Math.sqrt(denA * denB) || 1);
        }
        
        function getKeyNameFromIndex(index) {
            return NOTE_NAMES[((index % 12) + 12) % 12];
        }
        
        function getKeyNamePT(index) {
            return NOTE_NAMES_PT[((index % 12) + 12) % 12];
        }

        async function renderGrid() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';

            for (let index = 0; index < currentPlaylist.pads.length; index++) {

        function setupLongPress(element, index) {

            const end = () => clearTimeout(timer);
            element.addEventListener('mousedown', start);
            element.addEventListener('mouseup', end);

            element.addEventListener('touchend', end);
        }
        
        async function toggleSound(index) {
            const pad = playlists[currentPlaylistIndex].pads[index];
            if (!pad || !pad.audioKey) return;
            
            if (activeAudios[index]) {
                stopSound(index);
            } else {
                await playSound(index);
            }
        }
        
        async function playSound(index) {
            const pad = playlists[currentPlaylistIndex].pads[index];
            if (!pad || !pad.audioKey) return;
            
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                
                const blob = await getAudioFromDB(pad.audioKey);
                if (!blob) {
                    showToast('❌ Áudio não encontrado!', true);
                    return;
                }
                
                const arrayBuffer = await blob.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                
                if (pad.pitch && pad.pitch !== 0) {
                    source.playbackRate.value = Math.pow(2, pad.pitch / 12);
                }
                
                const gainNode = audioContext.createGain();
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (pad.fadeIn) {
                    gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(1, audioContext.currentTime + 1);
                } else {
                    gainNode.gain.setValueAtTime(1, audioContext.currentTime);
                }
                
                if (pad.fadeOut) {
                    const duration = audioBuffer.duration / (pad.pitch ? Math.pow(2, pad.pitch / 12) : 1);
                    const fadeOutStart = Math.max(0.1, duration - 2);
                    gainNode.gain.setValueAtTime(1, audioContext.currentTime + fadeOutStart);
                    gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + duration);
                }
                
                if (pad.loop) source.loop = true;
                
                source.start(0);
                activeAudios[index] = { source, gainNode };
                renderGrid();
                
                if (pad.timer && pad.timer > 0) {
                    setTimeout(() => stopSound(index), pad.timer * 1000);
                }
            } catch (err) {
                console.error('Erro ao tocar:', err);
                showToast('❌ Erro ao tocar', true);
            }
        }
        
        function stopSound(index) {
            if (activeAudios[index]) {
                const { source, gainNode } = activeAudios[index];
                try {
                    if (source.loop) {
                        gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 0.5);
                        setTimeout(() => { try { source.stop(); } catch(e) {} }, 500);
                    } else {
                        source.stop();
                    }
                } catch(e) {}
                delete activeAudios[index];
                renderGrid();
            }
        }

                renderGrid();

        function openRecordModal() {
            const firstEmpty = playlists[currentPlaylistIndex].pads.findIndex(p => p === null);
            selectedPadIndex = firstEmpty !== -1 ? firstEmpty : 0;
            document.getElementById('recordModal').classList.add('active');
            resetRecordModal();
        }
        
        function closeRecordModal() {
            document.getElementById('recordModal').classList.remove('active');
            if (isRecording) stopRecording();
        }
        
        function resetRecordModal() {
            isRecording = false;
            audioChunks = [];
            recordedBlob = null;
            document.getElementById('recordBtn').textContent = '🎤';
            document.getElementById('recordStatus').textContent = 'Pronto para gravar';
            document.getElementById('saveBtn').disabled = true;
        }
        
        async function toggleRecording() {
            if (!isRecording) await startRecording();
            else stopRecording();
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    recordedBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    document.getElementById('saveBtn').disabled = false;
                    document.getElementById('recordStatus').textContent = 'Gravação pronta!';
                };
                
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recordBtn').textContent = '⏹️';
                document.getElementById('recordStatus').textContent = 'Gravando...';
            } catch (err) {
                showToast('❌ Erro no microfone', true);
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                document.getElementById('recordBtn').textContent = '🎤';
            }
        }
        
        async function saveRecording() {
            if (recordedBlob && selectedPadIndex !== null) {
                const name = prompt('Nome do som:', 'Som ' + (selectedPadIndex + 1));
                if (name) {
                    try {
                        const audioKey = `audio_${Date.now()}_${selectedPadIndex}`;
                        await saveAudioToDB(audioKey, recordedBlob);
                        
                        const oldPad = playlists[currentPlaylistIndex].pads[selectedPadIndex];
                        if (oldPad && oldPad.audioKey) {
                            await deleteAudioFromDB(oldPad.audioKey);
                        }
                        
                        playlists[currentPlaylistIndex].pads[selectedPadIndex] = {
                            name,
                            audioKey,
                            category: document.querySelector('.category-btn.active').dataset.category,
                            loop: false,
                            fadeIn: false,
                            fadeOut: false,
                            pitch: 0,
                            timer: 0,
                            detectedKey: null
                        };
                        renderGrid();
                        savePlaylists();
                        showToast('✅ Som gravado!');
                        
                        // Analisar tom em background
                        analyzeKeyForPad(selectedPadIndex);
                    } catch (err) {
                        showToast('❌ Erro ao salvar', true);
                    }
                }
            }
            closeRecordModal();
        }
        
        async function analyzeKeyForPad(index) {
            const pad = playlists[currentPlaylistIndex].pads[index];
            if (!pad || !pad.audioKey) return;
            
            try {
                // Verificar cache
                const cached = await getKeyFromDB(pad.audioKey);
                if (cached) {
                    pad.detectedKey = cached.keyIndex;
                    pad.detectedKeyDisplay = cached.display;
                    savePlaylists();
                    renderGrid();
                    return;
                }
                
                const blob = await getAudioFromDB(pad.audioKey);
                if (!blob) return;
                
                const arrayBuffer = await blob.arrayBuffer();
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                const result = await detectKey(audioBuffer);
                
                pad.detectedKey = result.keyIndex;
                pad.detectedKeyDisplay = result.display;
                
                await saveKeyToDB(pad.audioKey, result);
                savePlaylists();
                renderGrid();
                showToast(`🎵 Tom detectado: ${result.display}`);
            } catch (err) {
                console.error('Erro análise:', err);
            }
        }
        
        async function openEditModal(index) {
            selectedPadIndex = index;
            const pad = playlists[currentPlaylistIndex].pads[index];
            document.getElementById('editPadName').textContent = pad ? `Editando: ${pad.name}` : 'Novo Som (Botão ' + (index + 1) + ')';
            document.getElementById('editName').value = pad ? pad.name : '';
            document.getElementById('editCategory').value = pad ? pad.category : 'pad';
            document.getElementById('editLoop').checked = pad ? pad.loop || false : false;
            document.getElementById('editFadeIn').checked = pad ? pad.fadeIn || false : false;
            document.getElementById('editFadeOut').checked = pad ? pad.fadeOut || false : false;
            document.getElementById('editTimer').value = pad ? pad.timer || 0 : 0;
            
            // Configurar tom
            currentTranspose = pad ? pad.pitch || 0 : 0;
            setTranspose(currentTranspose);
            
            // Exibir tom detectado
            if (pad && pad.detectedKey !== undefined && pad.detectedKey !== null) {
                currentDetectedKey = pad.detectedKey;
                const detectedName = getKeyNameFromIndex(pad.detectedKey);
                const detectedNamePT = getKeyNamePT(pad.detectedKey);
                document.getElementById('detectedKey').textContent = detectedName + ' (' + detectedNamePT + ')';
                updateCurrentKeyDisplay();
            } else if (pad && pad.audioKey) {
                document.getElementById('detectedKey').textContent = 'Analisando...';
                document.getElementById('currentKey').textContent = '...';
                currentDetectedKey = null;
                analyzeKeyForPad(index).then(() => {
                    const updatedPad = playlists[currentPlaylistIndex].pads[index];
                    if (updatedPad && updatedPad.detectedKey !== null) {
                        currentDetectedKey = updatedPad.detectedKey;
                        document.getElementById('detectedKey').textContent = 
                            getKeyNameFromIndex(updatedPad.detectedKey) + ' (' + getKeyNamePT(updatedPad.detectedKey) + ')';
                        updateCurrentKeyDisplay();
                    }
                });
            } else {
                document.getElementById('detectedKey').textContent = 'Sem áudio';
                document.getElementById('currentKey').textContent = '-';
                currentDetectedKey = null;
            }
            
            document.getElementById('editModal').classList.add('active');
        }

            document.getElementById('editModal').classList.remove('active');
            selectedPadIndex = null;
        }
        
        function openRecordFromEdit() {
            closeEditModal();
            openRecordModal();
        }
        
        async function reanalyzeKey() {
            if (selectedPadIndex === null) return;
            const pad = playlists[currentPlaylistIndex].pads[selectedPadIndex];
            if (!pad || !pad.audioKey) {
                showToast('❌ Sem áudio para analisar', true);
                return;
            }
            
            document.getElementById('detectedKey').textContent = 'Analisando...';
            
            try {
                const blob = await getAudioFromDB(pad.audioKey);
                const arrayBuffer = await blob.arrayBuffer();
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                const result = await detectKey(audioBuffer);
                
                pad.detectedKey = result.keyIndex;
                pad.detectedKeyDisplay = result.display;
                currentDetectedKey = result.keyIndex;
                
                await saveKeyToDB(pad.audioKey, result);
                savePlaylists();
                
                document.getElementById('detectedKey').textContent = 
                    getKeyNameFromIndex(result.keyIndex) + ' (' + getKeyNamePT(result.keyIndex) + ')';
                updateCurrentKeyDisplay();
                showToast(`🎵 Tom: ${result.display}`);
            } catch (err) {
                showToast('❌ Erro na análise', true);
            }
        }
        
        async function saveEdit() {
            const pad = playlists[currentPlaylistIndex].pads[selectedPadIndex];
            if (pad) {
                pad.name = document.getElementById('editName').value || pad.name;
                pad.category = document.getElementById('editCategory').value;
                pad.pitch = currentTranspose;
                pad.loop = document.getElementById('editLoop').checked;
                pad.fadeIn = document.getElementById('editFadeIn').checked;
                pad.fadeOut = document.getElementById('editFadeOut').checked;
                pad.timer = parseInt(document.getElementById('editTimer').value) || 0;
                renderGrid();
                savePlaylists();
                showToast('✅ Salvo!');

            closeEditModal();

        async function handleFileImport(event) {

            const targetIndex = pendingImportIndex;
            if (targetIndex === null || targetIndex === undefined) {
                showToast('❌ Selecione um botão', true);

            const name = prompt('Nome do som:', file.name.replace(/\.[^/.]+$/, ""));

                pendingImportIndex = null;
                return;
            }
            
            try {
                showToast('⏳ Importando...');
                
                const audioKey = `audio_${Date.now()}_${targetIndex}`;
                await saveAudioToDB(audioKey, file);
                
                const oldPad = playlists[currentPlaylistIndex].pads[targetIndex];
                if (oldPad && oldPad.audioKey) {
                    await deleteAudioFromDB(oldPad.audioKey);
                }
                
                playlists[currentPlaylistIndex].pads[targetIndex] = {
                    name,
                    audioKey,
                    category: document.querySelector('.category-btn.active').dataset.category,
                    loop: false,
                    fadeIn: false,
                    fadeOut: false,
                    pitch: 0,
                    timer: 0,
                    detectedKey: null
                };
                
                renderGrid();
                savePlaylists();
                showToast('✅ Áudio importado!');
                
                // Analisar tom em background
                analyzeKeyForPad(targetIndex);

                showToast('❌ Erro ao importar', true);

            pendingImportIndex = null;

            const file = event.target.files[0];
            event.target.value = '';
            
            if (!file || selectedPadIndex === null) return;
            
            const pad = playlists[currentPlaylistIndex].pads[selectedPadIndex];
            if (!pad) return;
            
            try {
                if (pad.audioKey) {
                    await deleteAudioFromDB(pad.audioKey);

                const audioKey = `audio_${Date.now()}_${selectedPadIndex}`;

                pad.detectedKey = null;
                
                renderGrid();
                savePlaylists();
                showToast('✅ Áudio substituído!');
                
                closeEditModal();
                analyzeKeyForPad(selectedPadIndex);

                showToast('❌ Erro', true);

        function openSettings() {
            const totalSounds = playlists.reduce((acc, p) => acc + p.pads.filter(pad => pad !== null).length, 0);
            alert('⚙️ Configurações:\n\n• Modo Escuro: ' + (darkMode ? 'Ativado' : 'Desativado') + '\n• Playlists: ' + playlists.length + '\n• Sons salvos: ' + totalSounds + '\n\n💡 Toque longo em um botão para editar tom, loop, fade.');
        }
        
        function savePlaylists() {
            localStorage.setItem('soundboard_playlists', JSON.stringify(playlists));
        }
        
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => toast.className = 'toast', 2500);
        }
        
        if (localStorage.getItem('soundboard_darkmode') === 'true') {
            darkMode = true;
            document.body.classList.add('dark-mode');
        }
        
        init();
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW:', e));
        }
    </script>
</body>
</html>
