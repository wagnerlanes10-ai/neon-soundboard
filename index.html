<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Soundboard</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0e27">
    <meta name="description" content="Soundboard com playlists personalizáveis">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Soundboard">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
            padding: 10px;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
        }
        
        .playlist-info { text-align: center; flex-grow: 1; }
        .playlist-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .playlist-name { font-size: 18px; font-weight: bold; color: #38bdf8; margin-top: 5px; }
        
        .add-playlist-btn {
            background: #38bdf8;
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .pad {
            aspect-ratio: 1;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            user-select: none;
        }
        
        .pad:active { transform: scale(0.93); }
        .pad.filled { animation: glow 2s ease-in-out infinite alternate; }
        
        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 255, 255, 0.15); }
            to { box-shadow: 0 0 30px rgba(255, 255, 255, 0.3); }
        }
        
        .pad.empty {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }
        
        .pad.green { background: linear-gradient(135deg, #4ade80, #16a34a); }
        .pad.blue { background: linear-gradient(135deg, #60a5fa, #2563eb); }
        .pad.purple { background: linear-gradient(135deg, #c084fc, #9333ea); }
        .pad.orange { background: linear-gradient(135deg, #fb923c, #ea580c); }
        .pad.red { background: linear-gradient(135deg, #f87171, #dc2626); }
        .pad.cyan { background: linear-gradient(135deg, #22d3ee, #0891b2); }
        .pad.pink { background: linear-gradient(135deg, #f472b6, #db2777); }
        .pad.yellow { background: linear-gradient(135deg, #facc15, #ca8a04); }
        .pad.indigo { background: linear-gradient(135deg, #818cf8, #4f46e5); }
        
        .pad-icon { font-size: 36px; margin-bottom: 8px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3)); }
        .pad-label { font-size: 10px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; padding: 0 5px; }
        .pad-duration { position: absolute; bottom: 6px; right: 6px; font-size: 9px; background: rgba(0, 0, 0, 0.3); padding: 2px 5px; border-radius: 8px; }
        .edit-indicator { position: absolute; top: 6px; right: 6px; background: rgba(0, 0, 0, 0.4); width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; opacity: 0; transition: opacity 0.3s; }
        .pad:hover .edit-indicator, .pad:active .edit-indicator { opacity: 1; }
        
        .footer-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .action-btn {
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-record { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-import { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        
        .instructions { text-align: center; margin-top: 15px; padding: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 10px; font-size: 11px; color: #94a3b8; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; text-align: center; }
        .modal-title { font-size: 22px; margin-bottom: 20px; color: #38bdf8; }
        
        .record-btn {
            width: 90px; height: 90px; border-radius: 50%; background: #ef4444; border: none; color: white; font-size: 36px; cursor: pointer; margin: 15px auto; display: flex; align-items: center; justify-content: center;
        }
        .record-btn.recording { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .volume-meter { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden; margin: 15px 0; }
        .volume-level { height: 100%; background: linear-gradient(90deg, #4ade80, #facc15, #ef4444); width: 0%; transition: width 0.1s; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .modal-btn { flex: 1; min-width: 100px; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-save { background: #4ade80; color: white; }
        .btn-cancel { background: #64748b; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .hidden-input { display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <button class="nav-btn" onclick="previousPlaylist()">⬅️</button>
            <div class="playlist-info">
                <div class="playlist-label">Playlist Atual</div>
                <div class="playlist-name" id="playlistName">Memes 2024</div>
            </div>
            <button class="add-playlist-btn" onclick="addPlaylist()">+</button>
        </div>
        
        <div class="grid" id="padGrid"></div>
        
        <div class="footer-controls">
            <button class="action-btn btn-record" onclick="openRecordModal()">🎙️ Gravar</button>
            <button class="action-btn btn-import" onclick="document.getElementById('fileInput').click()">📂 Importar</button>
        </div>
        
        <input type="file" id="fileInput" class="hidden-input" accept="audio/*" onchange="handleFileImport(event)">
        
        <div class="instructions">💡 Toque curto: Tocar | Toque longo: Editar</div>
    </div>
    
    <div class="modal" id="recordModal">
        <div class="modal-content">
            <h2 class="modal-title">🎙️ Gravar Som</h2>
            <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎤</button>
            <div class="volume-meter"><div class="volume-level" id="volumeLevel"></div></div>
            <p id="recordStatus">Pronto para gravar</p>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeRecordModal()">Cancelar</button>
                <button class="modal-btn btn-save" onclick="saveRecording()" id="saveBtn" disabled>Salvar</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 class="modal-title">✏️ Editar Botão</h2>
            <p id="editPadName" style="margin-bottom: 20px; color: #94a3b8;"></p>
            <div class="modal-actions" style="flex-direction: column;">
                <button class="modal-btn" style="background: #ef4444; color: white;" onclick="openRecordFromEdit()">🎙️ Gravar Novo</button>
                <button class="modal-btn" style="background: #3b82f6; color: white;" onclick="document.getElementById('editFileInput').click()">📂 Importar</button>
                <button class="modal-btn" style="background: #f59e0b; color: white;" onclick="renamePad()">✏️ Renomear</button>
                <button class="modal-btn btn-delete" onclick="clearPad()">🗑️ Limpar</button>
                <button class="modal-btn btn-cancel" onclick="closeEditModal()">Fechar</button>
            </div>
        </div>
        <input type="file" id="editFileInput" class="hidden-input" accept="audio/*" onchange="handleEditFileImport(event)">
    </div>
    
    <script>
        const colors = ['green', 'blue', 'purple', 'orange', 'red', 'cyan', 'pink', 'yellow', 'indigo'];
        let currentPlaylistIndex = 0;
        let selectedPadIndex = null;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedAudio = null;
        let volumeInterval = null;
        
        let playlists = JSON.parse(localStorage.getItem('soundboard_playlists')) || [{ name: 'Memes 2024', pads: Array(9).fill(null) }];
        
        function init() { renderGrid(); updatePlaylistName(); }
        
        function renderGrid() {
            const grid = document.getElementById('padGrid');
            grid.innerHTML = '';
            const currentPlaylist = playlists[currentPlaylistIndex];
            
            currentPlaylist.pads.forEach((pad, index) => {
                const padElement = document.createElement('div');
                padElement.className = `pad ${pad ? colors[index] : 'empty'} ${pad ? 'filled' : ''}`;
                
                if (pad) {
                    padElement.innerHTML = `
                        <div class="edit-indicator">✎</div>
                        <div class="pad-icon">🔊</div>
                        <div class="pad-label">${pad.name}</div>
                        <div class="pad-duration">${pad.duration || '0:00'}</div>
                    `;
                    padElement.onclick = () => playSound(index);
                    setupLongPress(padElement, index);
                } else {
                    padElement.innerHTML = `<div class="pad-icon" style="opacity: 0.3;">➕</div><div class="pad-label" style="opacity: 0.5;">Vazio</div>`;
                    padElement.onclick = () => openEditModal(index);
                }
                grid.appendChild(padElement);
            });
        }
        
        function setupLongPress(element, index) {
            let timer;
            const start = () => { timer = setTimeout(() => openEditModal(index), 600); };
            const end = () => clearTimeout(timer);
            element.addEventListener('mousedown', start);
            element.addEventListener('mouseup', end);
            element.addEventListener('mouseleave', end);
            element.addEventListener('touchstart', start, {passive: true});
            element.addEventListener('touchend', end);
        }
        
        function playSound(index) {
            const pad = playlists[currentPlaylistIndex].pads[index];
            if (pad && pad.audioData) {
                const audio = new Audio(pad.audioData);
                audio.play().catch(e => console.log('Erro ao tocar:', e));
            }
        }
        
        function previousPlaylist() {
            if (currentPlaylistIndex > 0) { currentPlaylistIndex--; updatePlaylistName(); renderGrid(); }
        }
        
        function nextPlaylist() {
            if (currentPlaylistIndex < playlists.length - 1) { currentPlaylistIndex++; updatePlaylistName(); renderGrid(); }
        }
        
        function addPlaylist() {
            const name = prompt('Nome da nova playlist:');
            if (name) {
                playlists.push({ name, pads: Array(9).fill(null) });
                currentPlaylistIndex = playlists.length - 1;
                updatePlaylistName(); renderGrid(); savePlaylists();
            }
        }
        
        function updatePlaylistName() { document.getElementById('playlistName').textContent = playlists[currentPlaylistIndex].name; }
        
        function openRecordModal() { document.getElementById('recordModal').classList.add('active'); resetRecordModal(); }
        function closeRecordModal() { document.getElementById('recordModal').classList.remove('active'); if (isRecording) stopRecording(); }
        
        function resetRecordModal() {
            isRecording = false; audioChunks = []; recordedAudio = null;
            document.getElementById('recordBtn').classList.remove('recording');
            document.getElementById('recordBtn').textContent = '🎤';
            document.getElementById('recordStatus').textContent = 'Pronto para gravar';
            document.getElementById('saveBtn').disabled = true;
            document.getElementById('volumeLevel').style.width = '0%';
            if (volumeInterval) clearInterval(volumeInterval);
        }
        
        async function toggleRecording() {
            if (!isRecording) await startRecording(); else stopRecording();
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    recordedAudio = URL.createObjectURL(audioBlob);
                    document.getElementById('saveBtn').disabled = false;
                    document.getElementById('recordStatus').textContent = 'Gravação pronta!';
                };
                
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordBtn').textContent = '⏹️';
                document.getElementById('recordStatus').textContent = 'Gravando...';
                
                volumeInterval = setInterval(() => {
                    const volume = Math.random() * 100;
                    document.getElementById('volumeLevel').style.width = volume + '%';
                }, 100);
            } catch (err) { alert('Erro ao acessar microfone: ' + err.message); }
        }
        
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                isRecording = false;
                document.getElementById('recordBtn').classList.remove('recording');
                document.getElementById('recordBtn').textContent = '🎤';
                if (volumeInterval) clearInterval(volumeInterval);
            }
        }
        
        function saveRecording() {
            if (recordedAudio && selectedPadIndex !== null) {
                const name = prompt('Nome do som:', 'Som ' + (selectedPadIndex + 1));
                if (name) {
                    playlists[currentPlaylistIndex].pads[selectedPadIndex] = { name, audioData: recordedAudio, duration: '0:05' };
                    renderGrid(); savePlaylists();
                }
            }
            closeRecordModal();
        }
        
        function openEditModal(index) {
            selectedPadIndex = index;
            const pad = playlists[currentPlaylistIndex].pads[index];
            document.getElementById('editPadName').textContent = pad ? `Botão: ${pad.name}` : 'Botão Vazio';
            document.getElementById('editModal').classList.add('active');
        }
        
        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); selectedPadIndex = null; }
        function openRecordFromEdit() { closeEditModal(); openRecordModal(); }
        
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (file && selectedPadIndex !== null) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const name = prompt('Nome do som:', file.name.replace(/\.[^/.]+$/, ""));
                    if (name) {
                        playlists[currentPlaylistIndex].pads[selectedPadIndex] = { name, audioData: e.target.result, duration: '0:00' };
                        renderGrid(); savePlaylists();
                    }
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }
        
        function handleEditFileImport(event) { handleFileImport(event); closeEditModal(); }
        
        function renamePad() {
            const pad = playlists[currentPlaylistIndex].pads[selectedPadIndex];
            if (pad) {
                const newName = prompt('Novo nome:', pad.name);
                if (newName) { pad.name = newName; renderGrid(); savePlaylists(); }
            }
            closeEditModal();
        }
        
        function clearPad() {
            if (confirm('Limpar este botão?')) {
                playlists[currentPlaylistIndex].pads[selectedPadIndex] = null;
                renderGrid(); savePlaylists();
            }
            closeEditModal();
        }
        
        function savePlaylists() { localStorage.setItem('soundboard_playlists', JSON.stringify(playlists)); }
        
        init();
        
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW não registrado:', e));
        }
    </script>
</body>
</html>
